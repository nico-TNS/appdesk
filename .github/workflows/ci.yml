name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout reviewed workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate project and engine without installations
        run: |
          .\scripts\Test-Project.ps1
          .\scripts\Test-Engine.ps1
      - name: Compile owned executable
        run: .\scripts\Build.ps1
      - name: Smoke-test embedded UI resources without installing apps
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'appdesk-self-test.txt'
          $p = Start-Process -FilePath "$pwd\dist\MonInstallateur.exe" -ArgumentList @('--self-test', ('"' + $result + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Executable self-test failed.' }
          if (!(Test-Path -LiteralPath $result)) { throw 'Executable self-test did not produce a result.' }
          Get-Content -LiteralPath $result
      - name: Upload explicitly unsigned build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AppDesk-unsigned-${{ github.sha }}
          path: |
            dist/MonInstallateur.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
