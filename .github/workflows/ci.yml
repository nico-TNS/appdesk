name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout reviewed workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate project and engine without installations
        run: |
          .\scripts\Test-Project.ps1
          .\scripts\Test-Engine.ps1
          .\scripts\Test-Sources.ps1
          .\scripts\Test-OfficeRemoval.ps1
          .\scripts\Test-Reliability.ps1
          .\scripts\Test-Inventory.ps1
          .\scripts\Test-UpdateOnly.ps1
          .\scripts\Test-FortiPreflight.ps1
      - name: Compile owned executable
        run: .\scripts\Build.ps1
      - name: Smoke-test embedded UI resources without installing apps
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'appdesk-self-test.txt'
          $p = Start-Process -FilePath "$pwd\dist\MonInstallateur.exe" -ArgumentList @('--self-test', ('"' + $result + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Executable self-test failed.' }
          if (!(Test-Path -LiteralPath $result)) { throw 'Executable self-test did not produce a result.' }
          Get-Content -LiteralPath $result
          .\scripts\Test-Reports.ps1
          .\scripts\Test-WorkerDiagnostics.ps1
          .\scripts\Test-Selections.ps1
          .\scripts\Test-LocalSessions.ps1
      - name: Upload explicitly unsigned build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppDesk-unsigned-${{ github.sha }}
          path: |
            dist/MonInstallateur.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
